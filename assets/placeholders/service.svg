  <g fill="#ffffff" opacity=".5">
    <circle cx="470" cy="150" r="9"/><circle cx="530" cy="110" r="6"/><circle cx="430" cy="210" r="5"/>
    <circle cx="590" cy="170" r="7"/><circle cx="640" cy="120" r="4"/>
  </g>
  <text x="400" y="465" font-family="system-ui,sans-serif" font-size="20" font-weight="700"
